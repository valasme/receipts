version: 2
project_name: receipts
builds:
  - main: ./cmd/receipts
    binary: receipts
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags: [-s, -w, "-X main.version={{ .Version }}"]
archives:
  - formats: [tar.gz]
    files:
      - src: README.md
        info: {mtime: "{{ .CommitDate }}", mode: 0644, owner: root, group: root}
      - src: LICENSE
        info: {mtime: "{{ .CommitDate }}", mode: 0644, owner: root, group: root}
      - src: THIRD-PARTY-NOTICES.txt
        info: {mtime: "{{ .CommitDate }}", mode: 0644, owner: root, group: root}
    builds_info: {owner: root, group: root}
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
nfpms:
  - package_name: receipts
    maintainer: Receipts maintainers <valasme@users.noreply.github.com>
    homepage: https://github.com/valasme/receipts
    description: Offline exact source quotation checker
    license: Apache-2.0
    mtime: "{{ .CommitDate }}"
    formats: [deb, rpm]
    rpm:
      buildhost: receipts
    contents:
      - src: LICENSE
        dst: /usr/share/doc/receipts/copyright
        packager: deb
        file_info: {mtime: "{{ .CommitDate }}", mode: 0644}
      - src: THIRD-PARTY-NOTICES.txt
        dst: /usr/share/doc/receipts/THIRD-PARTY-NOTICES.txt
        packager: deb
        file_info: {mtime: "{{ .CommitDate }}", mode: 0644}
      - src: LICENSE
        dst: /usr/share/licenses/receipts/LICENSE
        packager: rpm
        file_info: {mtime: "{{ .CommitDate }}", mode: 0644}
      - src: THIRD-PARTY-NOTICES.txt
        dst: /usr/share/licenses/receipts/THIRD-PARTY-NOTICES.txt
        packager: rpm
        file_info: {mtime: "{{ .CommitDate }}", mode: 0644}
release:
  draft: true
  prerelease: auto
