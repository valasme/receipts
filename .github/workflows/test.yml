name: Test
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      revision:
        type: string
        required: false
      historical:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.sha }}
          path: source
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.25.0'
          cache: false
      - shell: bash
        env:
          GOTOOLCHAIN: local
          HISTORICAL: ${{ inputs.historical || false }}
        run: |
          args=()
          if [[ "$HISTORICAL" == true ]]; then args+=(--historical); fi
          python tests/verify_source.py source "${args[@]}"
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: '1.25.0'
          cache: false
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
  diagnostics:
    if: inputs.historical != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
          cache: false
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go test -race ./...
      - run: go test ./cmd/receipts -run '^$' -fuzz '^FuzzSavedQuotationMatchesRaw$' -fuzztime=5s
      - run: go test ./internal/check -run '^$' -fuzz '^FuzzLookup$' -fuzztime=5s
      - run: go test ./internal/check -run '^$' -fuzz '^FuzzDelta$' -fuzztime=5s
      - run: |
          for target in FuzzCommit FuzzLoose FuzzPackIndex; do
            go test ./internal/check -run '^$' -fuzz "^${target}$" -fuzztime=5s
          done
      - run: python -m unittest discover -s pilot -v
      - run: |
          if [[ -d packaging ]]; then python -m unittest discover -s packaging -v; fi
          python -m unittest discover -s tests -v
      - name: Validate actual receipts against the versioned schema
        run: |
          python -m venv "$RUNNER_TEMP/schema"
          "$RUNNER_TEMP/schema/bin/pip" install jsonschema==4.25.1
          go build -o receipts-test.exe ./cmd/receipts
          "$RUNNER_TEMP/schema/bin/python" tests/acceptance.py ./receipts-test.exe
          "$RUNNER_TEMP/schema/bin/python" tests/evaluate.py ./receipts-test.exe
          "$RUNNER_TEMP/schema/bin/python" tests/claim_files.py ./receipts-test.exe
          "$RUNNER_TEMP/schema/bin/python" tests/file_changes.py ./receipts-test.exe
        env:
          RECEIPTS_VALIDATE_SCHEMA: '1'
