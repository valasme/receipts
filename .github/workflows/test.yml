name: Test
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      revision:
        type: string
        required: false
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go env GOOS GOARCH
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go build -o receipts-test.exe ./cmd/receipts
      - run: python tests/acceptance.py ./receipts-test.exe
      - run: python tests/claim_files.py ./receipts-test.exe
      - run: python examples/agent/replay.py ./receipts-test.exe
      - run: python tests/storage.py ./receipts-test.exe
      - run: python tests/golden.py ./receipts-test.exe
      - run: python tests/edge_cases.py ./receipts-test.exe
      - run: python tests/pack_depth.py ./receipts-test.exe
      - run: python tests/evaluate.py ./receipts-test.exe
      - run: go run ./cmd/receipts --version
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
          cache: false
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go test -race ./...
      - run: go test ./internal/check -run '^$' -fuzz '^FuzzLookup$' -fuzztime=5s
      - run: go test ./internal/check -run '^$' -fuzz '^FuzzDelta$' -fuzztime=5s
      - run: python -m unittest discover -s pilot -v
      - run: python -m unittest discover -s packaging -v
      - name: Validate actual receipts against the versioned schema
        run: |
          python -m venv "$RUNNER_TEMP/schema"
          "$RUNNER_TEMP/schema/bin/pip" install jsonschema==4.25.1
          go build -o receipts-test.exe ./cmd/receipts
          "$RUNNER_TEMP/schema/bin/python" tests/acceptance.py ./receipts-test.exe
          "$RUNNER_TEMP/schema/bin/python" tests/evaluate.py ./receipts-test.exe
        env:
          RECEIPTS_VALIDATE_SCHEMA: '1'
