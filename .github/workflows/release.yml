name: Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/test.yml

  package:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate tag
        if: github.ref_type == 'tag'
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          git merge-base --is-ancestor HEAD origin/main
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de
        with:
          version: v2.20.3
          args: release --clean --skip=publish ${{ github.ref_type != 'tag' && '--snapshot' || '' }}
      - run: python packaging/prepare.py dist bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate
          path: bundle/
          if-no-files-found: error
  install:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate
          path: bundle
      - run: python tests/package_smoke.py bundle
        env:
          RECEIPTS_NATIVE_ARCH: ${{ runner.arch }}
      - name: Install and remove Debian package
        if: runner.os == 'Linux'
        run: |
          arch=$(dpkg --print-architecture)
          sudo dpkg -i bundle/*_linux_"$arch".deb
          /usr/bin/receipts --version
          sudo dpkg -r receipts
          test ! -e /usr/bin/receipts
      - name: Validate WinGet manifest where WinGet is installed
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive bundle/preview-installers.zip -DestinationPath manifests
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget validate --manifest manifests/winget
            exit $LASTEXITCODE
          }
          Write-Output 'WinGet unavailable on this runner.'
  draft:
    needs: install
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate
          path: bundle
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: bundle/*
      - name: Stage a prerelease for owner review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" bundle/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease --latest=false --title "Receipts $GITHUB_REF_NAME" --notes "Offline source quotation checker. Verify artifact provenance and review platform signing status before installation."
