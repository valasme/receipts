name: Public install
on:
  workflow_call:
    inputs:
      candidate_revision:
        description: Pinned source commit of the candidate artifact built by this run
        type: string
      candidate_tag:
        type: string
      tag:
        type: string
      expected_commit:
        type: string
      expected_checksum:
        type: string
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        required: true
        description: Published release tag
        type: string
      previous_tag:
        description: Previous public tag for the upgrade and restore exercise
        type: string
        default: ''
      windows_only:
        description: Repeat just the Windows fresh-install consumers (no effect on transitions)
        type: boolean
        default: false
permissions:
  contents: read
  attestations: read
jobs:
  consumer:
    if: inputs.previous_tag == ''
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.windows_only && '["windows-2025","windows-11-arm"]' || '["ubuntu-24.04","ubuntu-24.04-arm","macos-15","macos-15-intel","windows-2025","windows-11-arm"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.candidate_tag || github.event.release.tag_name || inputs.tag }}
      CANDIDATE: ${{ inputs.candidate_revision }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: inputs.candidate_revision != ''
        with:
          name: candidate
          path: bundle
      - id: public
        name: Retrieve and authenticate the complete public bundle
        if: inputs.candidate_revision == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_CHECKSUM: ${{ inputs.expected_checksum }}
        run: |
          args=()
          if [[ -n "$EXPECTED_COMMIT" ]]; then args+=(--commit "$EXPECTED_COMMIT"); fi
          if [[ -n "$EXPECTED_CHECKSUM" ]]; then args+=(--checksum "$EXPECTED_CHECKSUM"); fi
          python packaging/stage.py public "$TAG" bundle "${args[@]}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_revision || steps.public.outputs.commit }}
          path: source
          persist-credentials: false
      - id: archive
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.candidate_revision || steps.public.outputs.commit }}
          WORKFLOW_COMMIT: ${{ github.workflow_sha }}
        run: |
          args=()
          if [[ -n "$CANDIDATE" ]]; then args+=(--workflow "$WORKFLOW_COMMIT"); fi
          python tests/package_smoke.py bundle source --tag "$TAG" --commit "$SOURCE_COMMIT" "${args[@]}"
      - name: Set up the RPM package manager
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm
      - name: Qualify native package installs using the archived binary and offline fixture
        if: runner.os != 'Windows'
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          SOURCE_COMMIT: ${{ inputs.candidate_revision || steps.public.outputs.commit }}
        run: |
          args=()
          if [[ -n "$CANDIDATE" ]]; then args+=(--source "$GITHUB_WORKSPACE/source"); fi
          channels=(brew)
          if [[ "$RUNNER_OS" == Linux ]]; then channels=(deb rpm); fi
          failed=0
          for channel in "${channels[@]}"; do
            python "$GITHUB_WORKSPACE/tests/preview_transition.py" install "$channel" "$GITHUB_WORKSPACE/bundle" \
              --tag "$TAG" --commit "$SOURCE_COMMIT" "${args[@]}" || failed=1
          done
          exit "$failed"
      - name: Enable local WinGet manifests
        id: winget
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tests/windows_installers.ps1 winget
      - name: Retrieve the Scoop installer
        id: scoop-bootstrap
        if: "!cancelled() && runner.os == 'Windows' && steps.archive.outcome == 'success'"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ScoopInstaller/Install
          ref: 1e2f334083d609986d8c8bc9e31ae8e87c39fab4
          path: scoop-bootstrap
          persist-credentials: false
      - name: Bootstrap isolated Scoop
        id: scoop
        if: "!cancelled() && steps.scoop-bootstrap.outcome == 'success'"
        shell: pwsh
        run: ./tests/windows_installers.ps1 scoop
      - name: Qualify Windows package installs using the archived binary and offline fixture
        if: "!cancelled() && runner.os == 'Windows' && steps.archive.outcome == 'success'"
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          SOURCE_COMMIT: ${{ inputs.candidate_revision || steps.public.outputs.commit }}
          WINGET_READY: ${{ steps.winget.outcome == 'success' }}
          SCOOP_READY: ${{ steps.scoop.outcome == 'success' }}
        run: |
          args=()
          if [[ -n "$CANDIDATE" ]]; then args+=(--source "$GITHUB_WORKSPACE/source"); fi
          failed=0
          for channel in winget scoop; do
            if [[ "$channel" == winget && "$WINGET_READY" != true ]]; then continue; fi
            if [[ "$channel" == scoop && "$SCOOP_READY" != true ]]; then continue; fi
            python "$GITHUB_WORKSPACE/tests/preview_transition.py" install "$channel" "$GITHUB_WORKSPACE/bundle" \
              --tag "$TAG" --commit "$SOURCE_COMMIT" "${args[@]}" || failed=1
          done
          exit "$failed"
      - if: "!cancelled() && steps.archive.outcome == 'success'"
        id: go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Qualify an isolated Go install
        if: "!cancelled() && steps.go.outcome == 'success'"
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          SOURCE_COMMIT: ${{ inputs.candidate_revision || steps.public.outputs.commit }}
        run: |
          args=()
          if [[ -n "$CANDIDATE" ]]; then args+=(--source "$GITHUB_WORKSPACE/source"); fi
          python "$GITHUB_WORKSPACE/tests/preview_transition.py" install go "$GITHUB_WORKSPACE/bundle" \
            --tag "$TAG" --commit "$SOURCE_COMMIT" "${args[@]}"
  transition:
    if: github.event_name == 'workflow_dispatch' && inputs.previous_tag != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, channel: archive}
          - {os: ubuntu-24.04-arm, channel: archive}
          - {os: macos-15, channel: archive}
          - {os: macos-15-intel, channel: archive}
          - {os: windows-2025, channel: archive}
          - {os: windows-11-arm, channel: archive}
          - {os: ubuntu-24.04, channel: go}
          - {os: ubuntu-24.04-arm, channel: go}
          - {os: macos-15, channel: go}
          - {os: macos-15-intel, channel: go}
          - {os: windows-2025, channel: go}
          - {os: windows-11-arm, channel: go}
          - {os: ubuntu-24.04, channel: deb}
          - {os: ubuntu-24.04-arm, channel: deb}
          - {os: ubuntu-24.04, channel: rpm}
          - {os: ubuntu-24.04-arm, channel: rpm}
          - {os: macos-15, channel: brew}
          - {os: macos-15-intel, channel: brew}
          - {os: windows-2025, channel: winget}
          - {os: windows-11-arm, channel: winget}
          - {os: windows-2025, channel: scoop}
          - {os: windows-11-arm, channel: scoop}
    env:
      CURRENT_TAG: ${{ inputs.tag }}
      PREVIOUS_TAG: ${{ inputs.previous_tag }}
      CHANNEL: ${{ matrix.channel }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download and authenticate both public previews
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tests/preview_transition.py" retrieve "$PREVIOUS_TAG" "$CURRENT_TAG"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        if: matrix.channel == 'go'
        with:
          go-version: 1.27.4
          cache: false
      - if: matrix.channel == 'rpm'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm
      - name: Enable local WinGet manifests
        if: matrix.channel == 'winget'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tests/windows_installers.ps1 winget
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: matrix.channel == 'scoop'
        with:
          repository: ScoopInstaller/Install
          ref: 1e2f334083d609986d8c8bc9e31ae8e87c39fab4
          path: scoop-bootstrap
          persist-credentials: false
      - name: Bootstrap isolated Scoop
        if: matrix.channel == 'scoop'
        shell: pwsh
        run: ./tests/windows_installers.ps1 scoop
      - name: Exercise install, upgrade, restore and removal from outside the checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tests/preview_transition.py" transition "$CHANNEL" "$PREVIOUS_TAG" "$CURRENT_TAG"
