name: Public install
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        required: true
        description: Published release tag
        type: string
      windows_only:
        description: Repeat just the Windows consumers
        type: boolean
        default: false
permissions:
  contents: read
  attestations: read
jobs:
  consumer:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.windows_only && '["windows-2025","windows-11-arm"]' || '["ubuntu-24.04","ubuntu-24.04-arm","macos-15","macos-15-intel","windows-2025","windows-11-arm"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Retrieve the public release and verify its signed manifest
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir bundle
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          jq -e --arg tag "$TAG" --arg commit "$commit" '.source_tag == $tag and .source_commit == $commit' bundle/build-record.json
          gh attestation verify bundle/build-record.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-digest "$(jq -r .workflow_commit bundle/build-record.json)"
          gh attestation verify bundle/checksums.txt --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-digest "$(jq -r .workflow_commit bundle/build-record.json)"
      - id: archive
        run: python tests/package_smoke.py bundle
        env:
          RECEIPTS_NATIVE_ARCH: ${{ runner.arch }}
      - name: Install the published Homebrew formula
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          unzip -q bundle/preview-installers.zip -d manifests
          brew tap-new --no-git valasme/receipts-preview
          tap=$(brew --repository valasme/receipts-preview)
          mkdir -p "$tap/Formula"
          cp manifests/Formula/receipts.rb "$tap/Formula/receipts.rb"
          brew install --formula valasme/receipts-preview/receipts
          brew test valasme/receipts-preview/receipts
          brew uninstall receipts
          brew untap valasme/receipts-preview
      - name: Verify Debian installation from the public download
        if: runner.os == 'Linux'
        run: |
          arch=$(dpkg --print-architecture)
          sudo dpkg -i bundle/*_linux_"$arch".deb
          /usr/bin/receipts --version
          sudo dpkg -r receipts
      - name: Verify RPM installation in an isolated package root
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm
          root=$(mktemp -d)
          arch=$(dpkg --print-architecture)
          sudo rpm --root "$root" --initdb
          sudo rpm --root "$root" --nodeps --ignorearch -i bundle/*_linux_"$arch".rpm
          "$root/usr/bin/receipts" --version
          sudo rpm --root "$root" -e receipts
      - name: Exercise the published WinGet manifest
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive bundle/preview-installers.zip -DestinationPath manifests
          if (!(Get-Command winget -ErrorAction SilentlyContinue)) {
            gh release download v1.29.380 --repo microsoft/winget-cli --dir winget-bootstrap -p DesktopAppInstaller_Dependencies.zip -p Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            Expand-Archive winget-bootstrap/DesktopAppInstaller_Dependencies.zip -DestinationPath winget-bootstrap/deps
            $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'x64' }
            $deps = @(Get-ChildItem -Recurse winget-bootstrap/deps -Include *.appx,*.msix | Where-Object { $_.FullName -match "[\\/]$arch[\\/]" } | ForEach-Object { $_.FullName })
            Add-AppxPackage -Path winget-bootstrap/Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle -DependencyPath $deps -ForceApplicationShutdown
            $installer = Get-AppxPackage Microsoft.DesktopAppInstaller
            $env:PATH = "$($installer.InstallLocation);$env:PATH"
          }
          winget settings --enable LocalManifestFiles
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          winget install --manifest manifests/winget --scope user --accept-source-agreements --accept-package-agreements --disable-interactivity
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:LOCALAPPDATA/Microsoft/WinGet/Links/receipts.exe" --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          winget uninstall --name "Receipts Preview" --exact --scope user --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (Test-Path "$env:LOCALAPPDATA/Microsoft/WinGet/Links/receipts.exe") { throw 'WinGet alias survived uninstall' }
      - name: Retrieve the Scoop installer
        if: "!cancelled() && runner.os == 'Windows' && steps.archive.outcome == 'success'"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ScoopInstaller/Install
          ref: 1e2f334083d609986d8c8bc9e31ae8e87c39fab4
          path: scoop-bootstrap
          persist-credentials: false
      - name: Exercise Scoop preview manifest in an isolated user tree
        if: "!cancelled() && runner.os == 'Windows' && steps.archive.outcome == 'success'"
        shell: pwsh
        run: |
          $env:SCOOP = Join-Path $env:RUNNER_TEMP 'receipts-scoop'
          & ./scoop-bootstrap/install.ps1 -ScoopDir $env:SCOOP -RunAsAdmin
          $scoop = Join-Path $env:SCOOP 'shims/scoop.ps1'
          Expand-Archive bundle/preview-installers.zip -DestinationPath scoop-input
          & $scoop install (Resolve-Path 'scoop-input/bucket/receipts.json').Path
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:SCOOP/apps/receipts/current/receipts.exe" --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $scoop uninstall receipts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (Test-Path "$env:SCOOP/shims/receipts.exe") { throw 'Scoop shim survived uninstall' }
      - if: "!cancelled() && steps.archive.outcome == 'success'"
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: 1.27.4
          cache: false
      - name: Install the tagged public Go module
        if: "!cancelled() && steps.archive.outcome == 'success'"
        shell: bash
        env:
          GOPROXY: direct
        run: |
          cd "$RUNNER_TEMP"
          go install "github.com/valasme/receipts/cmd/receipts@$TAG"
          installed="$(go env GOPATH)/bin/receipts"
          if [[ "$RUNNER_OS" == Windows ]]; then installed="$(cygpath -u "$installed").exe"; fi
          [[ "$("$installed" --version)" == "receipts $TAG" ]]
          rm "$installed"
