name: Public install
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        required: true
        description: Published release tag
        type: string
permissions:
  contents: read
  attestations: read
jobs:
  consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Retrieve the public release and verify its signed manifest
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir bundle
          gh attestation verify bundle/checksums.txt --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref "refs/tags/$TAG"
      - run: python tests/package_smoke.py bundle
        env:
          RECEIPTS_NATIVE_ARCH: ${{ runner.arch }}
      - name: Install the published Homebrew formula
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          unzip -q bundle/preview-installers.zip -d manifests
          brew tap-new --no-git valasme/receipts-preview
          tap=$(brew --repository valasme/receipts-preview)
          mkdir -p "$tap/Formula"
          cp manifests/Formula/receipts.rb "$tap/Formula/receipts.rb"
          brew install --formula valasme/receipts-preview/receipts
          brew test valasme/receipts-preview/receipts
          brew uninstall receipts
          brew untap valasme/receipts-preview
      - name: Verify Debian installation from the public download
        if: runner.os == 'Linux'
        run: |
          arch=$(dpkg --print-architecture)
          sudo dpkg -i bundle/*_linux_"$arch".deb
          /usr/bin/receipts --version
          sudo dpkg -r receipts
      - name: Verify RPM installation in an isolated package root
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm
          root=$(mktemp -d)
          arch=$(dpkg --print-architecture)
          sudo rpm --root "$root" --initdb
          sudo rpm --root "$root" --nodeps --ignorearch -i bundle/*_linux_"$arch".rpm
          "$root/usr/bin/receipts" --version
          sudo rpm --root "$root" -e receipts
      - name: Exercise the published WinGet manifest
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive bundle/preview-installers.zip -DestinationPath manifests
          if (!(Get-Command winget -ErrorAction SilentlyContinue)) { throw "WinGet unavailable" }
          winget settings --enable LocalManifestFiles
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          winget install --manifest manifests/winget --scope user --accept-source-agreements --accept-package-agreements --disable-interactivity
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:LOCALAPPDATA/Microsoft/WinGet/Links/receipts.exe" --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          winget uninstall --id Valasme.Receipts.Preview --exact --disable-interactivity
